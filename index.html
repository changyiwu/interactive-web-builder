<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上文字雲</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <!-- WordCloud2.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="gradient-text">線上文字雲</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- 新增字詞卡片 -->
      <section class="glass-card input-card">
        <h2>新增字詞</h2>
        <p class="subtitle">輸入字句後，系統會自動拆解進行詞頻分析並即時更新到文字雲中。</p>
        
        <form id="text-form">
          <div class="input-wrapper">
            <textarea id="text-input" placeholder="在這裡輸入一整段話或多個字詞（用空白或逗號分隔）..." required></textarea>
          </div>
          <button type="submit" class="primary-btn glow-btn">
            <span>送出並更新文字雲</span>
          </button>
        </form>
      </section>

      <!-- 文字雲畫布卡片 -->
      <section class="glass-card cloud-card">
        <div class="card-header">
          <h2>文字雲畫布</h2>
          <div id="connection-status" class="status-indicator offline">
            <span class="status-dot"></span>
            <span class="status-text">未連接 Firebase</span>
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="word-cloud-canvas"></canvas>
          <div id="welcome-overlay" class="overlay">
            <div class="overlay-content">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
              <h3>連線驗證中...</h3>
              <p>我們正在嘗試建立安全的資料庫連接。如果此畫面持續顯示，請前往 Firebase 控制台確認您的專案已啟用「匿名登入 (Anonymous Auth)」驗證方式。</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 熱門字詞卡片 -->
      <section class="glass-card stat-card">
        <div class="card-header">
          <h2>熱門字詞</h2>
          <button id="clear-all-btn" class="danger-btn outline-btn compact-btn" title="清除所有資料庫內容">
            <span>一鍵刪除全部</span>
          </button>
        </div>
        <div class="stat-container">
          <ul id="word-list" class="word-ranking">
            <!-- Dynamically populated ranking list -->
            <li class="empty-state">尚未有資料</li>
          </ul>
        </div>
      </section>
    </main>
  </div>

  <!-- 管理者驗證對話框 -->
  <div id="admin-modal" class="modal-overlay hidden">
    <form id="admin-form" class="glass-card modal-card">
      <h2>管理者驗證</h2>
      <p class="subtitle">「一鍵刪除全部」需要管理密碼。密碼只會在瀏覽器內換算成雜湊送出，明文不會離開這個頁面。</p>

      <label class="modal-field">
        <span>管理密碼</span>
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </label>

      <p id="admin-error" class="modal-error hidden"></p>

      <div class="modal-actions">
        <button type="button" id="admin-cancel" class="ghost-btn"><span>取消</span></button>
        <button type="submit" id="admin-submit" class="danger-btn"><span>確認刪除全部</span></button>
      </div>
    </form>
  </div>

  <!-- JS Module Entry -->
  <script type="module" src="app.js"></script>
</body>
</html>
